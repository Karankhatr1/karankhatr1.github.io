<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>
  <meta name="description" content="Portfolio — shared by direct link." />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cg fill='%230b57d0'%3E%3Cellipse cx='50' cy='19' rx='13' ry='19'/%3E%3Cellipse cx='50' cy='81' rx='13' ry='19'/%3E%3Cellipse cx='19' cy='50' rx='19' ry='13'/%3E%3Cellipse cx='81' cy='50' rx='19' ry='13'/%3E%3Ccircle cx='50' cy='50' r='14'/%3E%3C/g%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300..1000&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="shared/style.css" />
  <style>
    /* landing-only layout — style.css stays untouched */
    .landing { min-height: 100svh; display: grid; place-items: center; padding: 24px; }
    .landing .tile {
      max-width: 620px; width: 100%;
      padding: clamp(40px, 7vw, 64px);
      display: flex; flex-direction: column; align-items: center; text-align: center; gap: 18px;
    }
    .landing .flower { width: 44px; height: 44px; color: var(--primary); animation: spin 24s linear infinite; }
    .landing p { max-width: 42ch; }
  </style>
</head>
<body>

  <main class="landing">
    <div class="tile reveal in">
      <svg class="flower" viewBox="0 0 100 100" fill="currentColor" aria-hidden="true"><ellipse cx="50" cy="19" rx="12.5" ry="19"/><ellipse cx="50" cy="81" rx="12.5" ry="19"/><ellipse cx="19" cy="50" rx="19" ry="12.5"/><ellipse cx="81" cy="50" rx="19" ry="12.5"/><ellipse cx="50" cy="19" rx="12.5" ry="19" transform="rotate(45 50 50)"/><ellipse cx="50" cy="81" rx="12.5" ry="19" transform="rotate(45 50 50)"/><ellipse cx="19" cy="50" rx="19" ry="12.5" transform="rotate(45 50 50)"/><ellipse cx="81" cy="50" rx="19" ry="12.5" transform="rotate(45 50 50)"/><circle cx="50" cy="50" r="13"/></svg>
      <h1 class="display-2" id="landName">Portfolio</h1>
      <p class="muted">My work is shared by direct link, tailored to each conversation. If you’re looking for my portfolio, please use the link you were sent — or just say hello.</p>
      <a id="landMail" href="#" class="btn btn-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="m3 7 9 6 9-6"/></svg>
        Say hello
      </a>
      <span class="muted" style="font-size:.85rem">© <span id="year"></span> <span id="landName2"></span></span>
    </div>
  </main>

  <script src="shared/profile.js"></script>
  <script>
    (function () {
      if (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.add("dark");
      document.getElementById("landName").textContent = PROFILE.name;
      document.getElementById("landName2").textContent = PROFILE.name;
      document.getElementById("landMail").href = "mailto:" + PROFILE.email;
      document.getElementById("year").textContent = new Date().getFullYear();
      document.title = PROFILE.name;
    })();
  </script>
</body>
</html>
