<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>
  <meta name="description" content="Product design leadership portfolio — selected case studies." />
  <!-- Shared only by direct link: keep this view out of search engines -->
  <meta name="robots" content="noindex, nofollow" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cg fill='%230b57d0'%3E%3Cellipse cx='50' cy='19' rx='13' ry='19'/%3E%3Cellipse cx='50' cy='81' rx='13' ry='19'/%3E%3Cellipse cx='19' cy='50' rx='19' ry='13'/%3E%3Cellipse cx='81' cy='50' rx='19' ry='13'/%3E%3Ccircle cx='50' cy='50' r='14'/%3E%3C/g%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300..1000&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../shared/style.css" />
</head>
<body>

  <nav class="nav" aria-label="Main">
    <div class="nav-inner">
      <a href="index.html" class="brand">
        <span data-flower=""></span>
        <span data-bind="firstName">Portfolio</span>
      </a>
      <div class="nav-right">
        <a href="#work" class="nav-link">Work</a>
        <a href="#contact" class="nav-link">Contact</a>
        <button id="themeToggle" class="icon-btn" aria-label="Toggle light or dark theme">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <main class="container">

    <!-- ===== Hero bento ===== -->
    <section class="hero" id="top" aria-label="Introduction">

      <div class="tile tile-intro reveal">
        <div class="chip-row">
          <span class="chip">👋 Hello, I’m</span>
          <span class="chip chip-live"><span class="dot"></span><span data-bind="availability">Open to work</span></span>
        </div>
        <h1 class="display" data-bind="name">Your Name</h1>
        <div class="role-line"><span data-flower=""></span><span data-bind="role">Your Role</span></div>
        <p class="tagline" data-bind="tagline"></p>
        <div class="btn-row">
          <a href="#work" class="btn btn-primary">See my work
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14m-6-6 6 6 6-6"/></svg>
          </a>
          <a data-mail href="#" class="btn btn-tonal">Get in touch</a>
        </div>
      </div>

      <div class="tile tile-avatar reveal">
        <span class="avatar-flower" data-flower="avatar-flower"></span>
        <div class="blob" id="avatarBlob" role="img" aria-label="Portrait"></div>
        <span class="chip loc-chip">📍 <span data-bind="location"></span></span>
      </div>

      <div class="tile tile-about reveal">
        <div class="tile-label">About</div>
        <p data-bind="about"></p>
      </div>

      <div class="tile tile-clock reveal">
        <div class="tile-label">Local time — <span id="clockCity"></span></div>
        <div class="clock-time" id="clockTime">--:--</div>
      </div>

      <div class="tile tile-socials reveal">
        <div class="tile-label">Find me</div>
        <div class="social-list" id="socialList"></div>
      </div>

      <div class="stat-row" id="statRow"></div>

      <div class="tile tile-marquee reveal" aria-hidden="true">
        <div class="marquee"><div class="marquee-track" id="marqueeTrack"></div></div>
      </div>

    </section>

    <!-- ===== Work ===== -->
    <section class="section" id="work">
      <div class="section-head reveal">
        <h2 class="display-2">Case studies</h2>
        <span class="count" id="workCount"></span>
      </div>
      <div class="work-grid" id="workGrid"></div>
    </section>

    <!-- ===== Contact ===== -->
    <section class="section" id="contact">
      <div class="tile tile-contact reveal">
        <span class="contact-flower" data-flower="contact-flower"></span>
        <span class="overline" style="color: inherit; opacity:.75"><span class="spark" style="color:inherit">✦</span> Contact</span>
        <h2 class="display-2" data-bind="contactHeadline">Let’s talk.</h2>
        <p class="contact-line" data-bind="contactLine"></p>
        <div class="btn-row">
          <a data-mail href="#" class="btn btn-primary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="m3 7 9 6 9-6"/></svg>
            Email me
          </a>
          <a id="resumeBtn" href="#" class="btn btn-outline">View resume</a>
        </div>
        <div class="contact-socials" id="footerSocials"></div>
      </div>

      <div class="footer-bar">
        <span>© <span id="year"></span> <span data-bind="name"></span>. Built as a bento, with care.</span>
        <a href="#top">Back to top ↑</a>
      </div>
    </section>

  </main>

  <script src="../shared/profile.js"></script>
  <script src="data.js"></script>
  <script src="../shared/script.js"></script>
</body>
</html>
